<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Amazing Grace Home Based Childcare. A Safe Place to Learn, Play and Thrive.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Lobster&amp;family=Nunito:wght@900&amp;family=Kalam:wght@700&amp;display=swap');</style>
  <defs>
    <filter id="agwc" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <filter id="agsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <linearGradient id="aggold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE59A"/><stop offset=".55" stop-color="#F3C64F"/><stop offset="1" stop-color="#E3A23A"/></linearGradient>
    <linearGradient id="agwood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A26A43"/><stop offset="1" stop-color="#77472B"/></linearGradient>
    <linearGradient id="agpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEFD5"/><stop offset="1" stop-color="#EBD3A8"/></linearGradient>
  </defs>
  <!-- watercolor rainbow -->
  <g fill="none" stroke-width="15" opacity=".8" filter="url(#agwc)" stroke-linecap="round">
    <path d="M92 238A228 228 0 0 1 548 238" stroke="#EE9A8A"/>
    <path d="M107 238A213 213 0 0 1 533 238" stroke="#F4BC72"/>
    <path d="M122 238A198 198 0 0 1 518 238" stroke="#F5DC82"/>
    <path d="M137 238A183 183 0 0 1 503 238" stroke="#AFD49B"/>
    <path d="M152 238A168 168 0 0 1 488 238" stroke="#9CCAEA"/>
    <path d="M167 238A153 153 0 0 1 473 238" stroke="#BEA9DD"/>
  </g>
  <!-- clouds -->
  <g id="agcl">
    <g fill="#C9DFF0" filter="url(#agwc)"><ellipse cx="72" cy="232" rx="62" ry="26"/><ellipse cx="106" cy="210" rx="40" ry="31"/><ellipse cx="56" cy="208" rx="30" ry="23"/></g>
    <g fill="#fff" filter="url(#agsoft)"><ellipse cx="72" cy="228" rx="56" ry="22"/><ellipse cx="104" cy="207" rx="35" ry="27"/><ellipse cx="57" cy="205" rx="25" ry="19"/></g>
  </g>
  <use href="#agcl" transform="matrix(-1 0 0 1 640 0)"/>
  <!-- name -->
  <g font-family="Lobster, 'Brush Script MT', cursive" font-size="94" text-anchor="middle">
    <text x="323" y="156" fill="#1F4673" stroke="#1F4673" stroke-width="14" stroke-linejoin="round">Amazing Grace</text>
    <text x="320" y="152" fill="#24548A" stroke="#24548A" stroke-width="12" stroke-linejoin="round">Amazing Grace</text>
    <text x="320" y="152" fill="url(#aggold)" stroke="#FFF8E4" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Amazing Grace</text>
  </g>
  <!-- wooden sign -->
  <g transform="rotate(-1.2 320 196)">
    <rect x="146" y="170" width="348" height="50" rx="7" fill="url(#agwood)" stroke="#5C3520" stroke-width="2.5"/>
    <g stroke="#5C3520" stroke-width="1.6" fill="none" opacity=".45" stroke-linecap="round"><path d="M160 182c60-4 120 3 180-1s90 2 140-2"/><path d="M164 210c70 3 130-4 200 0s70-3 116 1"/></g>
    <circle cx="160" cy="195" r="3.2" fill="#3E2416"/><circle cx="480" cy="195" r="3.2" fill="#3E2416"/>
    <text x="320" y="204" text-anchor="middle" font-family="Nunito, 'Arial Black', sans-serif" font-weight="900" font-size="23" letter-spacing="1.5" fill="#FFF4DD">HOME BASED CHILDCARE</text>
  </g>
  <!-- parchment ribbon -->
  <g>
    <path d="M86 244h52l-6 22 6 22H86l14-22z" fill="#DDBF8C" stroke="#B48F5C" stroke-width="2"/>
    <path d="M554 244h-52l6 22-6 22h52l-14-22z" fill="#DDBF8C" stroke="#B48F5C" stroke-width="2"/>
    <path d="M118 236c70 8 134 10 202 10s132-2 202-10v44c-70 8-134 10-202 10s-132-2-202-10z" fill="url(#agpaper)" stroke="#B48F5C" stroke-width="2"/>
    <text x="320" y="272" text-anchor="middle" font-family="Kalam, 'Segoe Print', cursive" font-weight="700" font-size="23" fill="#6B3F26">A Safe Place to Learn, Play &amp; Thrive</text>
  </g>
</svg>
